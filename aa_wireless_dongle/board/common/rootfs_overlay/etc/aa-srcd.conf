#!/bin/sh

######## Configuration options for aa-srcd (the Pi as Android Auto source) ########

## Run the Pi as the Android Auto source instead of the wireless dongle proxy
## 0 - (default) aawgd proxy: a phone does Android Auto and the car shows the phone.
## 1 - aa-srcd: the Pi projects its own video, no phone involved. aawgd stays off,
##     because both need the USB accessory device.
AA_SRC_ENABLED=0


## Where the video comes from
## 1 - render the LVGL dashboard and encode it live (needs the lvgl + x264 packages).
## 0 - replay a pre-encoded Annex-B H.264 file (AA_SRC_VIDEO).
AA_SRC_LIVE=1


## Dashboard widgets when live: lvgl | pattern
## pattern is the built-in test card, useful to tell encoder problems from UI problems.
AA_SRC_UI=lvgl


## Pre-encoded stream used when AA_SRC_LIVE=0
AA_SRC_VIDEO=/persist/aa-srcd/dashboard.h264


## Playback rate and encoder bitrate
## Keep these low: the dashboard rarely changes and the Pi has no hardware H.264
## encoder on every model.
AA_SRC_FPS=5
AA_SRC_BITRATE=800


## Log every Android Auto message to syslog (verbose, good for first tests)
#AA_SRC_DEBUG=1
